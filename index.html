<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --acento:#c9a86a; --acento-claro:#e2c58a; --acento-borde:rgba(201,168,106,.35); --acento-tenue:rgba(201,168,106,.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 16px; padding-bottom: 84px; max-width: 600px; margin: 0 auto; }
    h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #cbd5e1; text-align: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #1e293b; }
    .card { background: #1e293b; border: 1px solid rgba(148,163,184,.08); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card.hero { border: 1px solid var(--acento-borde); }
    label { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 5px; color: #94a3b8; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 16px; margin-bottom: 12px; color-scheme: dark; }
    input:focus, select:focus { border-color: var(--acento); outline: none; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--acento); color: #15171c; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; cursor: pointer; }
    button:active { background: var(--acento-claro); }
    .btn-cancelar { background: #334155; color: #e2e8f0; margin-top: 10px; }
    .btn-cancelar:active { background: #3f4d63; }
    .btn-voz { background: var(--acento-tenue); color: var(--acento-claro); border: 1px solid var(--acento-borde); margin-bottom: 12px; }
    .btn-voz:active { background: rgba(201,168,106,.2); }
    .btn-sec { background: #334155; color: #e2e8f0; margin-top: 10px; }
    .btn-sec:active { background: #3f4d63; }
    .voz-result { font-size: 12px; color: #94a3b8; margin: -4px 0 12px; min-height: 14px; }
    .gasto { background: #1e293b; border: 1px solid rgba(148,163,184,.08); border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .gasto-info { font-size: 14px; }
    .gasto-info small { color: #94a3b8; display: block; }
    .gasto-monto { font-weight: bold; font-size: 16px; color: #e8796b; }
    .ingreso-monto { font-weight: bold; font-size: 16px; color: #34d399; }
    .ahorro-monto { font-weight: bold; font-size: 16px; color: #60a5fa; }
    .inversion-monto { font-weight: bold; font-size: 16px; color: #fb923c; }
    .borrar { background: none; border: none; color: #64748b; width: auto; padding: 4px 6px; font-size: 18px; }
    .borrar:active { background: none; }
    .total { font-size: 18px; font-weight: bold; text-align: center; }
    .vacio { text-align: center; color: #64748b; padding: 20px; }
    .filtros { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 4px 0 10px; padding: 0 2px; }
    .chip-label { color: #64748b; font-size: 12px; margin-right: 1px; }
    .chip { flex: 0 0 auto; background: #1e293b; color: #cbd5e1; border: 1px solid #475569; border-radius: 999px; padding: 7px 14px; font-size: 13px; white-space: nowrap; }
    .chip-on { background: #34d399; color: #0f172a; border-color: #34d399; font-weight: 600; }
    .onb { position: fixed; inset: 0; background: rgba(8,15,30,0.96); z-index: 1000; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 28px 16px; }
    .onb-card { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 22px; max-width: 460px; width: 100%; }
    .onb-card h2 { margin: 0 0 6px; color: #c9a86a; font-size: 20px; }
    .onb-card p { margin: 0 0 16px; color: #94a3b8; font-size: 14px; }
    .onb-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; margin-bottom: 7px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; font-size: 15px; color: #e2e8f0; }
    .onb-item input { width: 19px; height: 19px; accent-color: #34d399; }
    .onb-add { display: flex; gap: 8px; margin: 12px 0 18px; }
    .onb-add input { flex: 1; }
    .onb-add button { width: 52px; flex: 0 0 auto; margin: 0; }
    .mes-titulo { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
    .mes-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .mes-nav .flecha-mes { width:auto; background:var(--acento-tenue); color:var(--acento-claro); border:1px solid var(--acento-borde); border-radius:8px; padding:3px 18px; font-size:20px; line-height:1.1; }
    .mes-nav .flecha-mes:active { background:rgba(201,168,106,.2); }
    .mes-actual { font-size:14px; font-weight:600; letter-spacing:.04em; color:#cbd5e1; }
    .fila { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; }
    .balance { border-top: 1px solid #334155; margin-top: 8px; padding-top: 8px; font-weight: bold; }
    .verde { color: #34d399; font-weight: bold; } .rojo { color: #e8796b; font-weight: bold; }
    .azul { color: #60a5fa; font-weight: bold; } .naranja { color: #fb923c; font-weight: bold; }
    .oro { color: var(--acento-claro); font-weight: bold; }
    .patri-label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; }
    .patri-valor { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    .desglose { display: flex; justify-content: space-between; margin-top: 14px; gap: 8px; }
    .desglose div { flex: 1; text-align: center; background: #0f172a; border-radius: 8px; padding: 8px 4px; }
    .desglose small { display: block; color: #94a3b8; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 3px; }
    .desglose span { font-size: 13px; font-weight: bold; }
    .cotiz-info { font-size: 12px; color: #94a3b8; margin-top: 14px; border-top: 1px solid #334155; padding-top: 10px; line-height: 1.6; }
    .cotiz-info select { width: auto; display: inline-block; padding: 4px 8px; font-size: 12px; margin: 0 0 0 4px; }
    .seccion { display: none; } .seccion.activa { display: block; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #131c2e; border-top: 1px solid #243044; display: flex; justify-content: space-around; padding: 9px 0 10px; z-index: 100; }
    .nav button { background: none; border: none; width: auto; padding: 2px 4px; color: #64748b; font-size: 10px; letter-spacing: 0.02em; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; white-space: nowrap; }
    .nav button:active { background: none; }
    .nav svg { width: 22px; height: 22px; display: block; }
    .nav button.activa { color: var(--acento); }
  </style>
</head>
<body>

  <div id="onboarding" class="onb">
    <div class="onb-card">
      <h2 id="onb-titulo">¡Bienvenido a Mis Finanzas!</h2>
      <p id="onb-sub">Elegí los bancos y billeteras que usás. Vas a poder cambiarlos cuando quieras desde Inicio → Mis bancos.</p>
      <div id="onb-lista"></div>
      <div class="onb-add">
        <input id="onb-nuevo" placeholder="Agregar otro (ej. Naranja X)" onkeydown="if(event.key==='Enter')onbAgregar()">
        <button onclick="onbAgregar()">+</button>
      </div>
      <button id="onb-guardar" onclick="onbGuardar()">Empezar</button>
    </div>
  </div>

  <div class="seccion activa" id="seccion-inicio">
    <h1>Inicio</h1>
    <div id="patrimonio"></div>
    <div id="resumen-mensual"></div>
    <div class="card" id="datos-card">
      <div class="patri-label">Datos</div>
      <button onclick="exportarExcel()">Exportar a Excel</button>
      <button class="btn-sec" onclick="document.getElementById('file-import').click()">Importar Excel / CSV / PDF</button>
      <button class="btn-sec" onclick="abrirOnboarding(true)">Mis bancos</button>
      <input type="file" id="file-import" accept=".xlsx,.xls,.csv,.pdf" style="display:none" onchange="archivoElegido(this)">
      <div class="import-panel" id="import-panel"></div>
    </div>
  </div>

  <div class="seccion" id="seccion-ingresos">
    <h1>Ingresos</h1>
    <div class="card">
      <button type="button" class="btn-voz" id="btn-voz-i" onclick="escuchar(VOZ_CFG.ingreso)">🎤 Hablar</button>
      <div class="voz-result" id="voz-result-i"></div>
      <label>Monto</label><input type="number" id="i-monto" placeholder="0" inputmode="decimal">
      <label>Moneda</label><select id="i-moneda"><option value="ARS">Peso (AR$)</option><option value="USD">Dólar (US$)</option><option value="EUR">Euro (€)</option></select>
      <label>Categoría</label><select id="i-categoria"><option>Sueldo</option><option>Freelance</option><option>Ventas</option><option>Intereses</option><option>Regalo</option><option>Otros</option></select>
      <label>Medio</label><select id="i-medio"><option>Mercado Pago</option><option>BBVA</option><option>Galicia</option><option>Santander</option><option>Nación</option><option>Wise</option><option>Efectivo</option></select>
      <label>Nota</label><input type="text" id="i-nota" placeholder="Opcional">
      <label>Fecha</label><input type="date" id="i-fecha">
      <button id="btn-ingreso" onclick="agregarIngreso()">Agregar ingreso</button>
      <button id="cancel-ingreso" class="btn-cancelar" onclick="cancelarEdicionIngreso()" style="display:none;">Cancelar edición</button>
    </div>
    <div class="card"><div class="total" id="i-total"></div></div>
    <div id="i-filtros" class="filtros"></div>
    <div id="i-lista"></div>
  </div>

  <div class="seccion" id="seccion-gastos">
    <h1>Gastos</h1>
    <div class="card">
      <button type="button" class="btn-voz" id="btn-voz" onclick="escuchar(VOZ_CFG.gasto)">🎤 Hablar</button>
      <div class="voz-result" id="voz-result"></div>
      <label>Monto</label><input type="number" id="monto" placeholder="0" inputmode="decimal">
      <label>Moneda</label><select id="g-moneda"><option value="ARS">Peso (AR$)</option><option value="USD">Dólar (US$)</option><option value="EUR">Euro (€)</option></select>
      <label>Categoría</label><select id="categoria"><option>Comida</option><option>Transporte</option><option>Servicios</option><option>Ocio</option><option>Salud</option><option>Otros</option></select>
      <label>Medio de pago</label><select id="medio"><option>Mercado Pago</option><option>BBVA</option><option>Galicia</option><option>Santander</option><option>Nación</option><option>Wise</option><option>Efectivo</option></select>
      <label>Nota</label><input type="text" id="nota" placeholder="Opcional">
      <label>Fecha</label><input type="date" id="g-fecha">
      <button id="btn-gasto" onclick="agregarGasto()">Agregar gasto</button>
      <button id="cancel-gasto" class="btn-cancelar" onclick="cancelarEdicionGasto()" style="display:none;">Cancelar edición</button>
    </div>
    <div class="card"><div class="total" id="total"></div></div>
    <div id="lista"></div>
  </div>

  <div class="seccion" id="seccion-ahorros">
    <h1>Ahorros</h1>
    <div class="card">
      <button type="button" class="btn-voz" id="btn-voz-a" onclick="escuchar(VOZ_CFG.ahorro)">🎤 Hablar</button>
      <div class="voz-result" id="voz-result-a"></div>
      <label>Monto</label><input type="number" id="a-monto" placeholder="0" inputmode="decimal">
      <label>Moneda</label><select id="a-moneda"><option value="ARS">Peso (AR$)</option><option value="USD">Dólar (US$)</option><option value="EUR">Euro (€)</option></select>
      <label>Dónde</label><select id="a-donde"><option>Caja de ahorro</option><option>Plazo fijo</option><option>Dólares</option><option>Efectivo</option><option>Mercado Pago</option><option>Otros</option></select>
      <label>Nota</label><input type="text" id="a-nota" placeholder="Opcional">
      <label>Fecha</label><input type="date" id="a-fecha">
      <button id="btn-ahorro" onclick="agregarAhorro()">Agregar ahorro</button>
      <button id="cancel-ahorro" class="btn-cancelar" onclick="cancelarEdicionAhorro()" style="display:none;">Cancelar edición</button>
    </div>
    <div class="card"><div class="total" id="a-total"></div></div>
    <div id="a-lista"></div>
  </div>

  <div class="seccion" id="seccion-inversiones">
    <h1>Inversiones</h1>
    <div class="card">
      <button type="button" class="btn-voz" id="btn-voz-inv" onclick="escuchar(VOZ_CFG.inversion)">🎤 Hablar</button>
      <div class="voz-result" id="voz-result-inv"></div>
      <label>Monto</label><input type="number" id="inv-monto" placeholder="0" inputmode="decimal">
      <label>Moneda</label><select id="inv-moneda"><option value="ARS">Peso (AR$)</option><option value="USD">Dólar (US$)</option><option value="EUR">Euro (€)</option></select>
      <label>Tipo</label><select id="inv-tipo"><option>Acciones</option><option>CEDEARs</option><option>Cripto</option><option>Bonos</option><option>Fondos</option><option>Plazo fijo</option><option>Otros</option></select>
      <label>Nombre/Ticker</label><input type="text" id="inv-ticker" placeholder="Ej: AAPL, Bitcoin, AL30">
      <label>Nota</label><input type="text" id="inv-nota" placeholder="Opcional">
      <label>Fecha</label><input type="date" id="inv-fecha">
      <button id="btn-inversion" onclick="agregarInversion()">Agregar inversión</button>
      <button id="cancel-inversion" class="btn-cancelar" onclick="cancelarEdicionInversion()" style="display:none;">Cancelar edición</button>
    </div>
    <div class="card"><div class="total" id="inv-total"></div></div>
    <div id="inv-lista"></div>
  </div>

  <nav class="nav">
    <button class="activa" onclick="mostrar('inicio', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/></svg>Inicio</button>
    <button onclick="mostrar('ingresos', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v9"/><path d="M8 9.5l4 4 4-4"/><path d="M5 19h14"/></svg>Ingresos</button>
    <button onclick="mostrar('gastos', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V6"/><path d="M8 9.5l4-4 4 4"/><path d="M5 19h14"/></svg>Gastos</button>
    <button onclick="mostrar('ahorros', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="11" cy="12" r="3"/><path d="M14 12h3"/></svg>Ahorros</button>
    <button onclick="mostrar('inversiones', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v14h16"/><path d="M7 14l3.5-4 3 2.2L20 7"/></svg>Inversiones</button>
  </nav>

  <script>
    const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const MESNUM = { enero:0, febrero:1, marzo:2, abril:3, mayo:4, junio:5, julio:6, agosto:7, septiembre:8, setiembre:8, octubre:9, noviembre:10, diciembre:11 };
    const DEF_MONEDA = { 'g-moneda':'ARS', 'i-moneda':'EUR', 'a-moneda':'ARS', 'inv-moneda':'USD' };

    let cotiz = JSON.parse(localStorage.getItem('cotizaciones') || 'null');
    let tipoDolar = localStorage.getItem('tipoDolar') || 'bolsa';

    function simbolo(m) { return m === 'USD' ? 'US$' : m === 'EUR' ? '€' : 'AR$'; }
    function monedaDe(x) { return x.moneda || 'ARS'; }
    function fmtMonto(n) { return n.toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
    function fmtUSD(n) { return (n < 0 ? '-US$' : 'US$') + Math.abs(n).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
    function aUSD(monto, moneda) { if (!cotiz) return 0; if (moneda === 'USD') return monto; if (moneda === 'EUR') return monto * cotiz.eurUsd; return monto / cotiz.usdArs; }

    function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    function isoDeFecha(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function fechaDe(item) { if (item.fechaISO) { const p = item.fechaISO.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); } return new Date(item.id); }
    function isoDe(item) { return isoDeFecha(fechaDe(item)); }
    function leerFecha(idCampo) { const iso = document.getElementById(idCampo).value || hoyISO(); const p = iso.split('-').map(Number); return { fechaISO: iso, fecha: new Date(p[0], p[1]-1, p[2]).toLocaleDateString('es-AR') }; }
    function totalStr(items) { const sums = {}; items.forEach(x => { const m = monedaDe(x); sums[m] = (sums[m]||0) + x.monto; }); const parts = ['ARS','USD','EUR'].filter(m => sums[m]).map(m => simbolo(m) + fmtMonto(sums[m])); return parts.length ? parts.join(' · ') : '$0'; }

    function mostrar(nombre, boton) { document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa')); document.getElementById('seccion-'+nombre).classList.add('activa'); document.querySelectorAll('.nav button').forEach(b => b.classList.remove('activa')); boton.classList.add('activa'); window.scrollTo(0, 0); }

    // ===== ENTRADA POR VOZ (común a las 4 pantallas) =====
    function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
    function tiene(t, palabra) { const esc = palabra.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return new RegExp('(^|[^a-z0-9])' + esc + '([^a-z0-9]|$)').test(t); }

    const VOZ_MEDIOS = [
      { k:['mercado pago','mercadopago'], v:'Mercado Pago' },
      { k:['frances','bbva'], v:'BBVA' },
      { k:['galicia'], v:'Galicia' },
      { k:['santander'], v:'Santander' },
      { k:['nacion','banco nacion'], v:'Nación' },
      { k:['wise'], v:'Wise' },
      { k:['efectivo','cash'], v:'Efectivo' }
    ];
    const VOZ_CATS = [
      { v:'Comida', k:['comida','super','supermercado','la anonima','anonima','coto','carrefour','jumbo','vea','changomas','chango mas','almacen','verduleria','restaurante','resto','delivery','rappi','pedidosya','pedidos ya','mcdonalds','burger','cafe','bar','panaderia','kiosco'] },
      { v:'Transporte', k:['transporte','uber','cabify','didi','taxi','remis','sube','colectivo','subte','nafta','combustible','ypf','shell','axion','estacionamiento','peaje','tren'] },
      { v:'Servicios', k:['servicio','servicios','luz','gas','agua','internet','telefono','celular','spotify','netflix','disney','alquiler','expensas','edenor','edesur','metrogas','aysa'] },
      { v:'Ocio', k:['ocio','cine','salida','boliche','juego','videojuego','steam','libro','viaje','hotel','teatro','recital'] },
      { v:'Salud', k:['salud','farmacia','farmacity','remedio','medico','doctor','prepaga','dentista','gimnasio','gym'] }
    ];
    const VOZ_CATS_ING = [
      { v:'Sueldo', k:['sueldo','salario','paga','aguinaldo','quincena'] },
      { v:'Freelance', k:['freelance','free lance','proyecto','cliente','changa'] },
      { v:'Ventas', k:['venta','ventas','vendi','vendido'] },
      { v:'Intereses', k:['interes','intereses','renta','dividendo','dividendos','plazo fijo'] },
      { v:'Regalo', k:['regalo','regalaron'] }
    ];
    const VOZ_DONDE = [
      { v:'Caja de ahorro', k:['caja de ahorro','caja','banco','cuenta'] },
      { v:'Plazo fijo', k:['plazo fijo','plazo'] },
      { v:'Dólares', k:['dolar','dolares','verdes'] },
      { v:'Efectivo', k:['efectivo','cash','colchon'] },
      { v:'Mercado Pago', k:['mercado pago','mercadopago'] }
    ];
    const VOZ_TIPO_INV = [
      { v:'CEDEARs', k:['cedear','cedears'] },
      { v:'Cripto', k:['cripto','crypto','bitcoin','btc','ethereum','eth','dolar cripto','usdt'] },
      { v:'Bonos', k:['bono','bonos','al30','gd30'] },
      { v:'Fondos', k:['fondo','fondos','fci'] },
      { v:'Plazo fijo', k:['plazo fijo','plazo'] },
      { v:'Acciones', k:['accion','acciones'] }
    ];
    const VOZ_COMERCIOS = [
      { k:['la anonima','anonima'], n:'La Anónima' }, { k:['coto'], n:'Coto' }, { k:['carrefour'], n:'Carrefour' },
      { k:['jumbo'], n:'Jumbo' }, { k:['vea'], n:'Vea' }, { k:['changomas','chango mas'], n:'ChangoMás' },
      { k:['farmacity'], n:'Farmacity' }, { k:['ypf'], n:'YPF' }, { k:['shell'], n:'Shell' },
      { k:['pedidos ya','pedidosya'], n:'Pedidos Ya' }, { k:['rappi'], n:'Rappi' }
    ];

    const VOZ_CFG = {
      gasto:     { btnId:'btn-voz',     resultId:'voz-result',     monto:'monto',     moneda:'g-moneda',   medio:'medio',   selProp:'categoria',   dictProp:VOZ_CATS,     nota:'nota',     fecha:'g-fecha',   comercios:true,  btnLabel:'Agregar gasto' },
      ingreso:   { btnId:'btn-voz-i',   resultId:'voz-result-i',   monto:'i-monto',   moneda:'i-moneda',   medio:'i-medio', selProp:'i-categoria', dictProp:VOZ_CATS_ING, nota:'i-nota',   fecha:'i-fecha',   comercios:false, btnLabel:'Agregar ingreso' },
      ahorro:    { btnId:'btn-voz-a',   resultId:'voz-result-a',   monto:'a-monto',   moneda:'a-moneda',   medio:null,      selProp:'a-donde',     dictProp:VOZ_DONDE,    nota:'a-nota',   fecha:'a-fecha',   comercios:false, btnLabel:'Agregar ahorro' },
      inversion: { btnId:'btn-voz-inv', resultId:'voz-result-inv', monto:'inv-monto', moneda:'inv-moneda', medio:null,      selProp:'inv-tipo',    dictProp:VOZ_TIPO_INV, nota:'inv-nota', fecha:'inv-fecha', comercios:false, btnLabel:'Agregar inversión' }

    function parseFechaVoz(t) {
      let m = t.match(/(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?:\s+de\s+(\d{4}))?/);
      if (m) { const dia = parseInt(m[1],10), mes = MESNUM[m[2]], anio = m[3] ? parseInt(m[3],10) : new Date().getFullYear(); return { iso: anio+'-'+String(mes+1).padStart(2,'0')+'-'+String(dia).padStart(2,'0'), str: m[0] }; }
      m = t.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
      if (m) { const dia = parseInt(m[1],10), mes = parseInt(m[2],10)-1; let anio = m[3] ? parseInt(m[3],10) : new Date().getFullYear(); if (anio < 100) anio += 2000; return { iso: anio+'-'+String(mes+1).padStart(2,'0')+'-'+String(dia).padStart(2,'0'), str: m[0] }; }
      if (/\bayer\b/.test(t)) { const d = new Date(); d.setDate(d.getDate()-1); return { iso: isoDeFecha(d), str: 'ayer' }; }
      if (/\bhoy\b/.test(t)) { return { iso: hoyISO(), str: 'hoy' }; }
      return null;
    }

    function limpiarNota(s) {
      return s
        .replace(/\s*(el\s+)?\d{1,2}\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(\s+de\s+\d{4})?\s*/i, ' ')
        .replace(/\s*\d{1,2}\/\d{1,2}(\/\d{2,4})?\s*/, ' ')
        .replace(/\s*(hoy|ayer)\s*/i, ' ')
        .replace(/\d[\d.,]*\s+con\s+\d{1,2}\b/gi, ' ')
        .replace(/[€$]/g, ' ')
        .replace(/\s*\d[\d.,]*\s*/g, ' ')
        .replace(/\s*y\s+pagu[eé].*$/i, '')
        .replace(/\s*con\s+(mi\s+)?(tarjeta|cuenta).*$/i, '')
        .replace(/\s+(euros?|dolares?|pesos?)\s*/gi, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escuchar(cfg) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert('Tu navegador no soporta dictado por voz. Probalo en Chrome.'); return; }
      const rec = new SR();
      rec.lang = 'es-AR'; rec.interimResults = false; rec.maxAlternatives = 1;
      const btn = document.getElementById(cfg.btnId);
      document.getElementById(cfg.resultId).textContent = '';
      btn.textContent = '🎤 Escuchando…';
      rec.onresult = (e) => { interpretarVoz(e.results[0][0].transcript, cfg); };
      rec.onerror = (e) => { document.getElementById(cfg.resultId).textContent = '⚠️ No te escuché (' + e.error + '). Probá de nuevo.'; };
      rec.onend = () => { btn.textContent = '🎤 Hablar'; };
      try { rec.start(); } catch (err) { btn.textContent = '🎤 Hablar'; }
    }

    function interpretarVoz(texto, cfg) {
      document.getElementById(cfg.resultId).textContent = 'Entendí: "' + texto + '" — revisá y tocá ' + cfg.btnLabel + '.';
      let t = norm(texto);

      const fp = parseFechaVoz(t);
      if (fp) { document.getElementById(cfg.fecha).value = fp.iso; t = t.replace(fp.str, ' '); }
      else { document.getElementById(cfg.fecha).value = hoyISO(); }

      let moneda = 'ARS';
      if (texto.includes('€') || tiene(t,'euro') || tiene(t,'euros') || tiene(t,'eur')) moneda = 'EUR';
      else if (/us\$|u\$s/.test(t) || tiene(t,'dolar') || tiene(t,'dolares') || tiene(t,'usd')) moneda = 'USD';
      document.getElementById(cfg.moneda).value = moneda;

      let monto = null;
      const mDec = t.match(/(\d[\d.]*)\s+con\s+(\d{1,2})\b/);
      if (mDec) { const ent = mDec[1].replace(/[.,]/g,''); monto = parseFloat(ent + '.' + mDec[2].padStart(2,'0')); }
      else { const mNum = t.match(/(\d[\d.,]*\d|\d)/); if (mNum) monto = parseInt(mNum[0].replace(/[.,]/g,''),10); }
      if (monto && monto > 0) document.getElementById(cfg.monto).value = monto;

      if (cfg.medio) { for (const m of VOZ_MEDIOS) { if (m.k.some(k => tiene(t, k))) { document.getElementById(cfg.medio).value = m.v; break; } } }

      if (cfg.selProp && cfg.dictProp) { for (const c of cfg.dictProp) { if (c.k.some(k => tiene(t, k))) { document.getElementById(cfg.selProp).value = c.v; break; } } }

      let nota = '';
      if (cfg.comercios) { for (const com of VOZ_COMERCIOS) { if (com.k.some(k => tiene(t, k))) { nota = com.n; break; } } }
      if (!nota) { const mEn = texto.match(/ en (.+)/i); if (mEn) nota = limpiarNota(mEn[1]); }
      document.getElementById(cfg.nota).value = nota;
    }

    function selectorCotiz() {
      const nombre = { bolsa:'MEP', blue:'Blue', oficial:'Oficial' }[tipoDolar] || tipoDolar;
      const linea = cotiz ? `1 US$ = AR$${cotiz.usdArs.toLocaleString('es-AR')} (${nombre}) &nbsp;·&nbsp; 1 € = US$${cotiz.eurUsd.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:4})}<br>Actualizado: ${cotiz.fecha}` : 'Actualizando cotizaciones… (la primera vez necesitás internet)';
      return `<div class="cotiz-info">${linea}<br>Dólar: <select onchange="cambiarTipoDolar(this.value)"><option value="bolsa" ${tipoDolar==='bolsa'?'selected':''}>MEP</option><option value="blue" ${tipoDolar==='blue'?'selected':''}>Blue</option><option value="oficial" ${tipoDolar==='oficial'?'selected':''}>Oficial</option></select></div>`;
    }
    function renderPatrimonio() {
      const cont = document.getElementById('patrimonio');
      if (!cotiz) { cont.innerHTML = `<div class="card hero"><div class="patri-label">Patrimonio total (US$)</div><div class="vacio">Necesito las cotizaciones para convertir a dólares.</div>${selectorCotiz()}</div>`; return; }
      const sumU = (arr) => arr.reduce((s, x) => s + aUSD(x.monto, monedaDe(x)), 0);
      const totalIng = sumU(ingresos), totalGas = sumU(gastos), totalAho = sumU(ahorros), totalInv = sumU(inversiones);
      const disponible = totalIng - totalGas; const patrimonio = disponible + totalAho + totalInv;
      const movs = [];
      ingresos.forEach(i => movs.push({ d: fechaDe(i), v: aUSD(i.monto, monedaDe(i)) }));
      gastos.forEach(g => movs.push({ d: fechaDe(g), v: -aUSD(g.monto, monedaDe(g)) }));
      ahorros.forEach(a => movs.push({ d: fechaDe(a), v: aUSD(a.monto, monedaDe(a)) }));
      inversiones.forEach(inv => movs.push({ d: fechaDe(inv), v: aUSD(inv.monto, monedaDe(inv)) }));
      let grafico = '';
      if (movs.length) {
        const netMes = {};
        movs.forEach(m => { const d = m.d; const k = d.getFullYear()+'-'+String(d.getMonth()).padStart(2,'0'); if (!netMes[k]) netMes[k] = { mes:d.getMonth(), anio:d.getFullYear(), net:0 }; netMes[k].net += m.v; });
        let acum = 0;
        const puntos = Object.keys(netMes).sort().map(k => { acum += netMes[k].net; return { mes:netMes[k].mes, anio:netMes[k].anio, valor:acum }; });
        grafico = construirGrafico(puntos);

    }
    function construirGrafico(puntos) {
      const W = 320, H = 150, padL = 12, padR = 12, padT = 14, padB = 28;
      const plotW = W - padL - padR, plotH = H - padT - padB, n = puntos.length;
      const vals = puntos.map(p => p.valor); let min = Math.min(...vals), max = Math.max(...vals);
      if (min === max) { min -= 1; max += 1; }
      const coords = puntos.map((p, i) => ({ x: padL + (n === 1 ? plotW/2 : plotW*i/(n-1)), y: padT + plotH*(1-(p.valor-min)/(max-min)), p: p }));
      let zeroLine = '';
      if (min < 0 && max > 0) { const yz = padT + plotH*(1-(0-min)/(max-min)); zeroLine = `<line x1="${padL}" y1="${yz.toFixed(1)}" x2="${W-padR}" y2="${yz.toFixed(1)}" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>`; }
      const linea = coords.length > 1 ? `<polyline fill="none" stroke="#c9a86a" stroke-width="2" points="${coords.map(c => c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ')}"/>` : '';
      const circ = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="#c9a86a"/>`).join('');
      const etiq = coords.map(c => `<text x="${c.x.toFixed(1)}" y="${H-8}" fill="#94a3b8" font-size="9" text-anchor="middle">${MESES[c.p.mes].slice(0,3)}</text>`).join('');
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:10px;">${zeroLine}${linea}${circ}${etiq}</svg>`;
    }
    let mesVista = null;

      if (!mesVista) { const h = new Date(); mesVista = { anio: h.getFullYear(), mes: h.getMonth() }; }
      let m = mesVista.mes + delta, a = mesVista.anio;

    function renderInicio() {
      const cont = document.getElementById('resumen-mensual');

      if (!mesVista) { const h = new Date(); mesVista = { anio: h.getFullYear(), mes: h.getMonth() }; }
      const dias = new Date(mesVista.anio, mesVista.mes + 1, 0).getDate();
      const dIng = new Array(dias + 1).fill(0), dGas = new Array(dias + 1).fill(0);
      function acum(items, arr) { items.forEach(it => { const d = fechaDe(it); if (d.getFullYear() === mesVista.anio && d.getMonth() === mesVista.mes) arr[d.getDate()] += aUSD(it.monto, monedaDe(it)); }); }
      acum(ingresos, dIng); acum(gastos, dGas);
      const totIng = dIng.reduce((a, b) => a + b, 0), totGas = dGas.reduce((a, b) => a + b, 0), bal = totIng - totGas;
      const hay = totIng > 0 || totGas > 0;
      const grafico = hay ? construirGraficoDiario(dIng, dGas, dias) : '<div class="vacio">Sin movimientos en este mes.</div>';
      cont.innerHTML = `<div class="card">

    function construirGraficoDiario(dIng, dGas, dias) {
      const W = 320, H = 180, padL = 10, padR = 10, padT = 14, padB = 44;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const vals = [0]; for (let i = 1; i <= dias; i++) { vals.push(dIng[i]); vals.push(-dGas[i]); }
      let min = Math.min(...vals), max = Math.max(...vals); if (min === max) { min -= 1; max += 1; }
      const Y = v => padT + plotH * (1 - (v - min) / (max - min));
      const bw = plotW / dias, yz = Y(0);
      let barras = '';
      for (let i = 1; i <= dias; i++) {
        const x = padL + bw * (i - 1) + bw * 0.18, w = bw * 0.64;
        if (dIng[i] > 0) { const y = Y(dIng[i]); barras += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, yz - y).toFixed(1)}" fill="#34d399" rx="1"/>`; }
        if (dGas[i] > 0) { const y2 = Y(-dGas[i]); barras += `<rect x="${x.toFixed(1)}" y="${yz.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, y2 - yz).toFixed(1)}" fill="#e8796b" rx="1"/>`; }
      }
      const zline = `<line x1="${padL}" y1="${yz.toFixed(1)}" x2="${W - padR}" y2="${yz.toFixed(1)}" stroke="#475569" stroke-width="1"/>`;
      const marcas = [1]; for (let d = 5; d < dias; d += 5) marcas.push(d); if (marcas[marcas.length - 1] !== dias) marcas.push(dias);
      let etiq = ''; marcas.forEach(d => { const x = padL + bw * (d - 1) + bw * 0.5; etiq += `<text x="${x.toFixed(1)}" y="${(padT + plotH + 15).toFixed(1)}" fill="#94a3b8" font-size="9" text-anchor="middle">${d}</text>`; });
      const ly = H - 6;
      const leg = `<g font-family="sans-serif" font-size="9.5" fill="#94a3b8"><rect x="${padL}" y="${ly - 8}" width="10" height="8" rx="1" fill="#34d399"/><text x="${padL + 15}" y="${ly - 1}">Ingresos</text><rect x="${padL + 78}" y="${ly - 8}" width="10" height="8" rx="1" fill="#e8796b"/><text x="${padL + 93}" y="${ly - 1}">Gastos</text></g>`;
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:10px;">${zline}${barras}${etiq}${leg}</svg>`;
    }

    function numImport(v) {
      if (typeof v === 'number') return v;
      if (v == null) return NaN;
      let s = String(v).trim(); if (!s) return NaN;
      const neg = /^\(.*\)$/.test(s) || s.includes('-');
      s = s.replace(/[^\d.,]/g, '');
      if (s.includes('.') && s.includes(',')) {
        if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
        else s = s.replace(/,/g, '');
      } else if (s.includes(',')) {
        const p = s.split(',');
        if (p.length === 2 && p[1].length <= 2) s = s.replace(',', '.');
        else s = s.replace(/,/g, '');
      }
      let n = parseFloat(s); if (isNaN(n)) return NaN;
      return neg ? -Math.abs(n) : n;
    }
    function fechaImport(v) {
      if (v instanceof Date && !isNaN(v)) return v;
      if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); if (!isNaN(d)) return d; }
      const s = String(v).trim();
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return new Date(+m[1], +m[2]-1, +m[3]);
      m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
      if (m) { let dd=+m[1], mm=+m[2], yy=+m[3]; if (yy<100) yy+=2000; if (mm>12 && dd<=12){ const t=dd; dd=mm; mm=t; } const d=new Date(yy, mm-1, dd); if(!isNaN(d)) return d; }
      const d = new Date(s); return isNaN(d) ? null : d;
    }
    function monedaImport(v) {
      const s = String(v||'').toLowerCase();
      if (/usd|u\$|d[oó]l/.test(s)) return 'USD';
      if (/eur|€/.test(s)) return 'EUR';
      if (/ars|peso|\$/.test(s)) return 'ARS';
      return null;
    }
    function detectarCol(headers, regex) { for (let i=0;i<headers.length;i++){ if (regex.test(String(headers[i]))) return i; } return -1; }
    function catDesde(desc, dict) { const t = norm(String(desc||'')); for (const c of dict) { if (c.k.some(k => tiene(t, k))) return c.v; } return null; }
    function medioDesde(desc) { const t = norm(String(desc||'')); for (const m of VOZ_MEDIOS) { if (m.k.some(k => tiene(t, k))) return m.v; } return null; }

    let IMP = null;
    function cargarPDFjs() {
      return new Promise((res, rej) => {
        if (window.pdfjsLib) { res(); return; }
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload = () => { try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(); } catch(e){ rej(e); } };
        s.onerror = () => rej(new Error('No pude cargar el lector de PDF. ¿Tenés internet?'));

    async function extraerLineasPDF(file) {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const lineas = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        const rows = {};
        tc.items.forEach(it => {
          if (!it.str || !it.str.trim()) return;
          const y = Math.round(it.transform[5]);
          (rows[y] = rows[y] || []).push([it.transform[4], it.str]);
        });
        Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y => {
          const linea = rows[y].sort((a,b)=>a[0]-b[0]).map(t=>t[1]).join(' ').replace(/\s+/g,' ').trim();
          if (linea) lineas.push(linea);
        });
      }
      return lineas;
    }
    function parseBBVA(lineas) {
      const filas = [];
      const reDate = /^(\d{2}\/\d{2}\/\d{4})\s+(.+?)\s+(-?[\d.]+,\d{2})$/;
      for (const ln of lineas) {
        const m = ln.match(reDate);
        if (!m) continue;
        const comercio = m[2]
          .replace(/(?:\*{2,}\s*)+\d{4}/g, ' ')
          .replace(/\s*\$\s*$/, '')
          .replace(/\s+\d{6}\s*$/, '')
          .replace(/\s+/g, ' ').trim();
        if (!comercio) continue;
        filas.push([m[1], comercio, m[3]]);
      }
      return filas;
    }
    async function extraerItemsPDF(file) {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const pages = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        const items = [];
        tc.items.forEach(it => {
          if (!it.str || !it.str.trim()) return;
          items.push({ x: it.transform[4], y: it.transform[5], s: it.str.trim() });
        });
        pages.push(items);
      }
      return pages;
    }
    function parseMercadoPago(pages) {
      const reFecha = /^\d{2}-\d{2}-\d{4}$/;
      const rePeso = /^\$\s*-?[\d.]+,\d{2}$/;
      const filas = [];
      for (const items of pages) {
        const fechas = items.filter(it => it.x < 70 && reFecha.test(it.s));
        for (const f of fechas) {
          const yd = f.y;
          const fila = items.filter(it => Math.abs(it.y - yd) <= 4);
          if (fila.some(it => /US\$/.test(it.s))) continue; // tabla en dólares: la salteamos
          const pesos = fila.filter(it => rePeso.test(it.s)).sort((a,b)=>a.x-b.x);
          if (!pesos.length) continue;
          const valor = pesos[0].s.replace(/\$/,'').replace(/\s+/g,'').trim();
          const desc = items
            .filter(it => it.x >= 75 && it.x < 190 && Math.abs(it.y - yd) <= 16)
            .sort((a,b)=> b.y - a.y)
            .map(it => it.s).join(' ').replace(/\s+/g,' ').trim();
          filas.push([f.s, desc, valor]);
        }
      }
      return filas;
    }
    function parseBBVAMov(pages) {
      const reMonto = /^-?[\d.]+,\d{2}$/;
      let anio = new Date().getFullYear();
      for (const items of pages) { let hit=false; for (const it of items) { const m=it.s.match(/\b\d{2}\/\d{2}\/(\d{4})\b/); if(m){anio=+m[1];hit=true;break;} } if(hit) break; }
      const filas = [];
      for (const items of pages) {
        const fechas = items.filter(it => it.x < 90 && /^\d{2}\/\d{2}$/.test(it.s));
        for (const f of fechas) {
          const yd = f.y;
          const row = items.filter(it => Math.abs(it.y - yd) <= 4);
          const concepto = row.filter(it => it.x >= 125 && it.x < 380).sort((a,b)=>a.x-b.x).map(it=>it.s).join(' ').replace(/\s+/g,' ').trim();
          if (/PAGO CON VISA DEBITO/i.test(concepto)) continue; // ya vienen de la tabla de Compras
          const deb = row.filter(it => reMonto.test(it.s) && it.x < 445).sort((a,b)=>a.x-b.x)[0];
          const cred = row.filter(it => reMonto.test(it.s) && it.x >= 445 && it.x < 515).sort((a,b)=>a.x-b.x)[0];
          let valor = null;
          if (cred) valor = cred.s.replace('-','');
          else if (deb) valor = deb.s.charAt(0)==='-' ? deb.s : ('-'+deb.s);
          if (!valor) continue;
          filas.push([f.s + '/' + anio, concepto, valor]);
        }
      }
      return filas;
    }
    async function importarPDF(file, panel) {
      try { await cargarPDFjs(); } catch (e) { panel.innerHTML = '<div class="vacio">'+e.message+'</div>'; return; }
      let lineas, pages;
      try {
        lineas = await extraerLineasPDF(file);
        pages = await extraerItemsPDF(file);
      } catch (e) { panel.innerHTML = '<div class="vacio">No pude leer el PDF ('+e.message+').</div>'; return; }
      let filas = parseBBVA(lineas);
      let origen = '';
      if (filas.length) { filas = filas.concat(parseBBVAMov(pages)); origen = 'BBVA'; }
      else { filas = parseMercadoPago(pages); if (filas.length) origen = 'Mercado Pago'; }
      if (!filas.length) {
        panel.innerHTML = '<div class="vacio">No reconocí movimientos en este PDF. Por ahora leo resúmenes de BBVA y de Mercado Pago.</div>';
        return;
      }
      IMP = { headers: ['Fecha','Comercio','Importe'], filas, origen };
      mostrarMapeo();
    }

      input.value = '';
    }

    function leerMapeo() {
      return {
        fechaC: +document.getElementById('map-fecha').value,

    function interpretarFilas() {
      const m = leerMapeo();
      const out = [];
      for (const r of IMP.filas) {
        let monto = numImport(r[m.montoC]);
        if (isNaN(monto) || monto === 0) continue;
        const desc = m.descC >= 0 ? String(r[m.descC]||'').trim() : '';
        const fd = fechaImport(r[m.fechaC]);
        let moneda;
        if (m.monV.indexOf('fija-') === 0) moneda = m.monV.slice(5);
        else moneda = monedaImport(r[+m.monV]) || 'ARS';
        let destino = m.destino;
        if (destino === 'signo') destino = monto >= 0 ? 'ingresos' : 'gastos';
        out.push({ monto: Math.abs(monto), moneda, desc, fecha: fd, destino, origen: m.origen });
      }
      return out;
    }
    function previsualizarImport() {
      const items = interpretarFilas();
      const prev = document.getElementById('import-preview');
      if (!items.length) { prev.innerHTML = '<div class="vacio">No pude interpretar montos válidos. Revisá la columna Monto.</div>'; return; }
      const porDest = {}; items.forEach(i=>{porDest[i.destino]=(porDest[i.destino]||0)+1;});
      const resumen = Object.keys(porDest).map(k=>porDest[k]+' → '+k).join(' · ');
      const muestra = items.slice(0,3).map(i=>`<div class="fila"><span>${i.fecha?i.fecha.toLocaleDateString('es-AR'):'sin fecha'} · ${i.desc||'—'}</span><span>${simbolo(i.moneda)}${fmtMonto(i.monto)} → ${i.destino}</span></div>`).join('');
      prev.innerHTML = `<div style="margin-top:12px;"><div class="patri-label">Vista previa · ${items.length} movimientos</div><div style="font-size:13px;color:#94a3b8;margin-bottom:8px;">${resumen}</div>${muestra}<button onclick="confirmarImport()">Importar ${items.length} movimientos</button></div>`;
    }
    function huellaMov(destino, fechaISO, monto, moneda, nota) {
      return destino + '|' + fechaISO + '|' + Number(monto).toFixed(2) + '|' + (moneda || 'ARS') + '|' + String(nota || '').trim().toLowerCase();
    }
    function confirmarImport() {
      const items = interpretarFilas();
      // Huellas de lo que ya está cargado: para no duplicar y para reclasificar al reimportar
      const refs = {};
      const stores = { gastos: gastos, ingresos: ingresos, ahorros: ahorros, inversiones: inversiones };
      Object.keys(stores).forEach(dest => {
        stores[dest].forEach(o => {
          const h = huellaMov(dest, o.fechaISO || isoDe(o), o.monto, monedaDe(o), o.nota);
          (refs[h] = refs[h] || []).push(o);
        });
      });
      let n = 0, dup = 0, retag = 0;
      items.forEach((it, idx) => {
        const fechaISO = it.fecha ? isoDeFecha(it.fecha) : hoyISO();
        const h = huellaMov(it.destino, fechaISO, it.monto, it.moneda, it.desc);
        if (refs[h] && refs[h].length) { // ya existe: no duplico, pero le actualizo el origen
          const ex = refs[h].shift(); dup++;
          if (it.origen && (ex.donde === undefined) && ex.medio !== it.origen) { ex.medio = it.origen; retag++; }
          return;
        }
        const fechaStr = (it.fecha || new Date()).toLocaleDateString('es-AR');
        const base = { id: Date.now() + idx, monto: it.monto, moneda: it.moneda, nota: it.desc, fecha: fechaStr, fechaISO: fechaISO };
        if (it.destino === 'gastos') gastos.unshift(Object.assign(base, { categoria: catDesde(it.desc, VOZ_CATS) || 'Otros', medio: it.origen || 'Importado' }));
        else if (it.destino === 'ingresos') ingresos.unshift(Object.assign(base, { categoria: catDesde(it.desc, VOZ_CATS_ING) || 'Otros', medio: it.origen || 'Importado' }));
        else if (it.destino === 'ahorros') ahorros.unshift(Object.assign(base, { donde: 'Importado' }));
        else if (it.destino === 'inversiones') inversiones.unshift(Object.assign(base, { tipo: 'Otros', ticker: '' }));
        n++;
      });
      guardar(); guardarIngresos(); guardarAhorros(); guardarInversiones();
      render(); renderIngresos(); renderAhorros(); renderInversiones();
      IMP = null;
      let aviso = '';
      if (dup > 0) aviso += ` (omití ${dup} repetidos`;
      if (retag > 0) aviso += `${dup > 0 ? ', ' : ' ('}reclasifiqué ${retag} por origen`;
      if (aviso) aviso += ')';
      document.getElementById('import-panel').innerHTML = `<div class="vacio" style="color:#34d399;">Importé ${n} movimientos${aviso}. Revisalos en cada pestaña.</div>`;
    }
    async function exportarExcel() {
      try { await cargarXLSX(); } catch (e) { alert(e.message); return; }
      const wb = XLSX.utils.book_new();
      const aoaG = [['Fecha','Monto','Moneda','Categoría','Medio','Nota']].concat(gastos.map(g=>[g.fechaISO||isoDe(g), g.monto, monedaDe(g), g.categoria, g.medio, g.nota||'']));
      const aoaI = [['Fecha','Monto','Moneda','Categoría','Medio','Nota']].concat(ingresos.map(i=>[i.fechaISO||isoDe(i), i.monto, monedaDe(i), i.categoria, i.medio, i.nota||'']));
      const aoaA = [['Fecha','Monto','Moneda','Dónde','Nota']].concat(ahorros.map(a=>[a.fechaISO||isoDe(a), a.monto, monedaDe(a), a.donde, a.nota||'']));
      const aoaV = [['Fecha','Monto','Moneda','Tipo','Ticker','Nota']].concat(inversiones.map(v=>[v.fechaISO||isoDe(v), v.monto, monedaDe(v), v.tipo, v.ticker||'', v.nota||'']));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaG), 'Gastos');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaI), 'Ingresos');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaA), 'Ahorros');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaV), 'Inversiones');
      XLSX.writeFile(wb, 'mis-finanzas-' + hoyISO() + '.xlsx');
    }

    const BANCOS_SUGERIDOS = ['Mercado Pago', 'BBVA', 'Galicia', 'Santander', 'Nación', 'Brubank', 'Ualá', 'Wise', 'eToro', 'Efectivo'];
    let bancos = JSON.parse(localStorage.getItem('mf_bancos') || 'null');
    let onbSel = [];
    function bancosActivos() { return (bancos && bancos.length) ? bancos : ['Mercado Pago', 'BBVA', 'Wise']; }
    function abrirOnboarding(edicion) {
      onbSel = (bancos || []).slice();
      document.getElementById('onb-titulo').textContent = edicion ? 'Mis bancos' : '¡Bienvenido a Mis Finanzas!';
      document.getElementById('onb-guardar').textContent = edicion ? 'Guardar' : 'Empezar';
      renderOnbLista();
      document.getElementById('onboarding').style.display = 'flex';
    }
    function renderOnbLista() {
      const lista = Array.from(new Set(BANCOS_SUGERIDOS.concat(onbSel)));
      document.getElementById('onb-lista').innerHTML = lista.map(b =>
        `<label class="onb-item"><input type="checkbox" ${onbSel.includes(b) ? 'checked' : ''} onchange="onbToggle('${b.replace(/'/g, "\\'")}', this.checked)"> ${b}</label>`).join('');
    }
    function onbToggle(b, on) { if (on) { if (!onbSel.includes(b)) onbSel.push(b); } else { onbSel = onbSel.filter(x => x !== b); } }
    function onbAgregar() {
      const inp = document.getElementById('onb-nuevo'); const v = inp.value.trim();
      if (!v) return;
      if (!onbSel.includes(v)) onbSel.push(v);
      inp.value = '';
      renderOnbLista();
    }
    function onbGuardar() {
      bancos = onbSel.slice();
      localStorage.setItem('mf_bancos', JSON.stringify(bancos));
      document.getElementById('onboarding').style.display = 'none';
      aplicarBancos();
      renderIngresos(); render();
    }
    function aplicarBancos() {
      const opts = bancosActivos();
      ['i-medio', 'medio'].forEach(id => {
        const s = document.getElementById(id);
        if (s) { const cur = s.value; s.innerHTML = opts.map(o => `<option>${o}</option>`).join(''); if (opts.includes(cur)) s.value = cur; }
      });
    }

    Object.keys(DEF_MONEDA).forEach(id => { const el = document.getElementById(id); if (el) el.value = DEF_MONEDA[id]; });
    ['g-fecha','i-fecha','a-fecha','inv-fecha'].forEach(id => { const el = document.getElementById(id); if (el) el.value = hoyISO(); });
    render(); renderIngresos(); renderAhorros(); renderInversiones(); cargarCotizaciones();
    aplicarBancos();
    if (!bancos) abrirOnboarding(false);
  </script>
</body>
</html>
