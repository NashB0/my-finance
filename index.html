<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
      padding-bottom: 80px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; margin-bottom: 16px; text-align: center; }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #94a3b8; }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 16px;
      margin-bottom: 12px;
      color-scheme: dark;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { background: #2563eb; }
    .gasto {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gasto-info { font-size: 14px; }
    .gasto-info small { color: #94a3b8; display: block; }
    .gasto-monto { font-weight: bold; font-size: 16px; color: #f87171; }
    .ingreso-monto { font-weight: bold; font-size: 16px; color: #4ade80; }
    .ahorro-monto { font-weight: bold; font-size: 16px; color: #60a5fa; }
    .inversion-monto { font-weight: bold; font-size: 16px; color: #fb923c; }
    .borrar {
      background: none;
      border: none;
      color: #64748b;
      width: auto;
      padding: 4px 8px;
      font-size: 18px;
    }
    .total { font-size: 20px; font-weight: bold; text-align: center; }
    .vacio { text-align: center; color: #64748b; padding: 20px; }

    /* Resumen mensual (Inicio) */
    .mes-titulo { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
    .fila { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; }
    .balance { border-top: 1px solid #334155; margin-top: 8px; padding-top: 8px; font-weight: bold; }
    .verde { color: #4ade80; font-weight: bold; }
    .rojo { color: #f87171; font-weight: bold; }
    .azul { color: #60a5fa; font-weight: bold; }
    .naranja { color: #fb923c; font-weight: bold; }

    /* Tarjeta de Patrimonio */
    .patri-label { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    .patri-valor { font-size: 26px; font-weight: bold; }
    .desglose { display: flex; justify-content: space-between; margin-top: 12px; gap: 8px; }
    .desglose div { flex: 1; text-align: center; background: #0f172a; border-radius: 8px; padding: 8px 4px; }
    .desglose small { display: block; color: #94a3b8; font-size: 11px; margin-bottom: 2px; }
    .desglose span { font-size: 13px; font-weight: bold; }

    /* Secciones: solo se ve la activa */
    .seccion { display: none; }
    .seccion.activa { display: block; }

    /* Barra de menu inferior */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 100;
    }
    .nav button {
      background: none;
      border: none;
      width: auto;
      padding: 4px;
      color: #64748b;
      font-size: 10px;
      font-weight: normal;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }
    .nav button:active { background: none; }
    .nav .icono { font-size: 20px; }
    .nav button.activa { color: #3b82f6; }
  </style>
</head>
<body>

  <!-- INICIO -->
  <div class="seccion activa" id="seccion-inicio">
    <h1>🏠 Inicio</h1>
    <div id="patrimonio"></div>
    <div id="resumen-mensual"></div>
  </div>

  <!-- INGRESOS -->
  <div class="seccion" id="seccion-ingresos">
    <h1>💰 Ingresos</h1>

    <div class="card">
      <label>Monto</label>
      <input type="number" id="i-monto" placeholder="0" inputmode="decimal">

      <label>Categoría</label>
      <select id="i-categoria">
        <option>Sueldo</option>
        <option>Freelance</option>
        <option>Ventas</option>
        <option>Intereses</option>
        <option>Regalo</option>
        <option>Otros</option>
      </select>

      <label>Medio</label>
      <select id="i-medio">
        <option>Mercado Pago</option>
        <option>BBVA</option>
        <option>Wise</option>
        <option>Efectivo</option>
      </select>

      <label>Nota</label>
      <input type="text" id="i-nota" placeholder="Opcional">

      <label>Fecha</label>
      <input type="date" id="i-fecha">

      <button onclick="agregarIngreso()">Agregar ingreso</button>
    </div>

    <div class="card">
      <div class="total">Total: $<span id="i-total">0</span></div>
    </div>

    <div id="i-lista"></div>
  </div>

  <!-- GASTOS -->
  <div class="seccion" id="seccion-gastos">
    <h1>💸 Gastos</h1>

    <div class="card">
      <label>Monto</label>
      <input type="number" id="monto" placeholder="0" inputmode="decimal">

      <label>Categoría</label>
      <select id="categoria">
        <option>Comida</option>
        <option>Transporte</option>
        <option>Servicios</option>
        <option>Ocio</option>
        <option>Salud</option>
        <option>Otros</option>
      </select>

      <label>Medio de pago</label>
      <select id="medio">
        <option>Mercado Pago</option>
        <option>BBVA</option>
        <option>Wise</option>
        <option>Efectivo</option>
      </select>

      <label>Nota</label>
      <input type="text" id="nota" placeholder="Opcional">

      <label>Fecha</label>
      <input type="date" id="g-fecha">

      <button onclick="agregarGasto()">Agregar gasto</button>
    </div>

    <div class="card">
      <div class="total">Total: $<span id="total">0</span></div>
    </div>

    <div id="lista"></div>
  </div>

  <!-- AHORROS -->
  <div class="seccion" id="seccion-ahorros">
    <h1>🏦 Ahorros</h1>

    <div class="card">
      <label>Monto</label>
      <input type="number" id="a-monto" placeholder="0" inputmode="decimal">

      <label>Dónde</label>
      <select id="a-donde">
        <option>Caja de ahorro</option>
        <option>Plazo fijo</option>
        <option>Dólares</option>
        <option>Efectivo</option>
        <option>Mercado Pago</option>
        <option>Otros</option>
      </select>

      <label>Nota</label>
      <input type="text" id="a-nota" placeholder="Opcional">

      <label>Fecha</label>
      <input type="date" id="a-fecha">

      <button onclick="agregarAhorro()">Agregar ahorro</button>
    </div>

    <div class="card">
      <div class="total">Total ahorrado: $<span id="a-total">0</span></div>
    </div>

    <div id="a-lista"></div>
  </div>

  <!-- INVERSIONES -->
  <div class="seccion" id="seccion-inversiones">
    <h1>📈 Inversiones</h1>

    <div class="card">
      <label>Monto</label>
      <input type="number" id="inv-monto" placeholder="0" inputmode="decimal">

      <label>Tipo</label>
      <select id="inv-tipo">
        <option>Acciones</option>
        <option>CEDEARs</option>
        <option>Cripto</option>
        <option>Bonos</option>
        <option>Fondos</option>
        <option>Plazo fijo</option>
        <option>Otros</option>
      </select>

      <label>Nombre/Ticker</label>
      <input type="text" id="inv-ticker" placeholder="Ej: AAPL, Bitcoin, AL30">

      <label>Nota</label>
      <input type="text" id="inv-nota" placeholder="Opcional">

      <label>Fecha</label>
      <input type="date" id="inv-fecha">

      <button onclick="agregarInversion()">Agregar inversión</button>
    </div>

    <div class="card">
      <div class="total">Total invertido: $<span id="inv-total">0</span></div>
    </div>

    <div id="inv-lista"></div>
  </div>

  <!-- BARRA DE MENU INFERIOR -->
  <nav class="nav">
    <button class="activa" onclick="mostrar('inicio', this)"><span class="icono">🏠</span>Inicio</button>
    <button onclick="mostrar('ingresos', this)"><span class="icono">💰</span>Ingresos</button>
    <button onclick="mostrar('gastos', this)"><span class="icono">💸</span>Gastos</button>
    <button onclick="mostrar('ahorros', this)"><span class="icono">🏦</span>Ahorros</button>
    <button onclick="mostrar('inversiones', this)"><span class="icono">📈</span>Inversiones</button>
  </nav>

  <script>
    const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

    function fmt(n) {
      return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('es-AR');
    }

    // Fecha de hoy en formato YYYY-MM-DD (hora local)
    function hoyISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    // Devuelve la fecha de un movimiento: usa fechaISO si existe, si no el id viejo
    function fechaDe(item) {
      if (item.fechaISO) {
        const p = item.fechaISO.split('-').map(Number);
        return new Date(p[0], p[1] - 1, p[2]);
      }
      return new Date(item.id);
    }

    // Lee el campo de fecha y arma {fechaISO, fecha} para guardar
    function leerFecha(idCampo) {
      const iso = document.getElementById(idCampo).value || hoyISO();
      const p = iso.split('-').map(Number);
      const txt = new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('es-AR');
      return { fechaISO: iso, fecha: txt };
    }

    // --- Cambiar de pantalla con el menu ---
    function mostrar(nombre, boton) {
      document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
      document.getElementById('seccion-' + nombre).classList.add('activa');
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('activa'));
      boton.classList.add('activa');
      window.scrollTo(0, 0);
    }

    // --- Gastos ---
    let gastos = JSON.parse(localStorage.getItem('gastos') || '[]');

    function guardar() {
      localStorage.setItem('gastos', JSON.stringify(gastos));
    }

    function agregarGasto() {
      const monto = parseFloat(document.getElementById('monto').value);
      if (!monto || monto <= 0) {
        alert('Ingresá un monto válido');
        return;
      }
      const f = leerFecha('g-fecha');
      const gasto = {
        id: Date.now(),
        monto: monto,
        categoria: document.getElementById('categoria').value,
        medio: document.getElementById('medio').value,
        nota: document.getElementById('nota').value,
        fecha: f.fecha,
        fechaISO: f.fechaISO
      };
      gastos.unshift(gasto);
      guardar();
      document.getElementById('monto').value = '';
      document.getElementById('nota').value = '';
      document.getElementById('g-fecha').value = hoyISO();
      render();
    }

    function borrarGasto(id) {
      gastos = gastos.filter(g => g.id !== id);
      guardar();
      render();
    }

    function render() {
      const lista = document.getElementById('lista');
      const total = gastos.reduce((s, g) => s + g.monto, 0);
      document.getElementById('total').textContent = total.toLocaleString('es-AR');

      if (gastos.length === 0) {
        lista.innerHTML = '<div class="vacio">No hay gastos cargados todavía</div>';
      } else {
        lista.innerHTML = gastos.map(g => `
          <div class="gasto">
            <div class="gasto-info">
              <strong>${g.categoria}</strong>
              <small>${g.medio} · ${g.fecha}${g.nota ? ' · ' + g.nota : ''}</small>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="gasto-monto">$${g.monto.toLocaleString('es-AR')}</span>
              <button class="borrar" onclick="borrarGasto(${g.id})">🗑️</button>
            </div>
          </div>
        `).join('');
      }
      actualizarInicio();
    }

    // --- Ingresos ---
    let ingresos = JSON.parse(localStorage.getItem('ingresos') || '[]');

    function guardarIngresos() {
      localStorage.setItem('ingresos', JSON.stringify(ingresos));
    }

    function agregarIngreso() {
      const monto = parseFloat(document.getElementById('i-monto').value);
      if (!monto || monto <= 0) {
        alert('Ingresá un monto válido');
        return;
      }
      const f = leerFecha('i-fecha');
      const ingreso = {
        id: Date.now(),
        monto: monto,
        categoria: document.getElementById('i-categoria').value,
        medio: document.getElementById('i-medio').value,
        nota: document.getElementById('i-nota').value,
        fecha: f.fecha,
        fechaISO: f.fechaISO
      };
      ingresos.unshift(ingreso);
      guardarIngresos();
      document.getElementById('i-monto').value = '';
      document.getElementById('i-nota').value = '';
      document.getElementById('i-fecha').value = hoyISO();
      renderIngresos();
    }

    function borrarIngreso(id) {
      ingresos = ingresos.filter(i => i.id !== id);
      guardarIngresos();
      renderIngresos();
    }

    function renderIngresos() {
      const lista = document.getElementById('i-lista');
      const total = ingresos.reduce((s, i) => s + i.monto, 0);
      document.getElementById('i-total').textContent = total.toLocaleString('es-AR');

      if (ingresos.length === 0) {
        lista.innerHTML = '<div class="vacio">No hay ingresos cargados todavía</div>';
      } else {
        lista.innerHTML = ingresos.map(i => `
          <div class="gasto">
            <div class="gasto-info">
              <strong>${i.categoria}</strong>
              <small>${i.medio} · ${i.fecha}${i.nota ? ' · ' + i.nota : ''}</small>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="ingreso-monto">$${i.monto.toLocaleString('es-AR')}</span>
              <button class="borrar" onclick="borrarIngreso(${i.id})">🗑️</button>
            </div>
          </div>
        `).join('');
      }
      actualizarInicio();
    }

    // --- Ahorros ---
    let ahorros = JSON.parse(localStorage.getItem('ahorros') || '[]');

    function guardarAhorros() {
      localStorage.setItem('ahorros', JSON.stringify(ahorros));
    }

    function agregarAhorro() {
      const monto = parseFloat(document.getElementById('a-monto').value);
      if (!monto || monto <= 0) {
        alert('Ingresá un monto válido');
        return;
      }
      const f = leerFecha('a-fecha');
      const ahorro = {
        id: Date.now(),
        monto: monto,
        donde: document.getElementById('a-donde').value,
        nota: document.getElementById('a-nota').value,
        fecha: f.fecha,
        fechaISO: f.fechaISO
      };
      ahorros.unshift(ahorro);
      guardarAhorros();
      document.getElementById('a-monto').value = '';
      document.getElementById('a-nota').value = '';
      document.getElementById('a-fecha').value = hoyISO();
      renderAhorros();
    }

    function borrarAhorro(id) {
      ahorros = ahorros.filter(a => a.id !== id);
      guardarAhorros();
      renderAhorros();
    }

    function renderAhorros() {
      const lista = document.getElementById('a-lista');
      const total = ahorros.reduce((s, a) => s + a.monto, 0);
      document.getElementById('a-total').textContent = total.toLocaleString('es-AR');

      if (ahorros.length === 0) {
        lista.innerHTML = '<div class="vacio">No hay ahorros cargados todavía</div>';
      } else {
        lista.innerHTML = ahorros.map(a => `
          <div class="gasto">
            <div class="gasto-info">
              <strong>${a.donde}</strong>
              <small>${a.fecha}${a.nota ? ' · ' + a.nota : ''}</small>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="ahorro-monto">$${a.monto.toLocaleString('es-AR')}</span>
              <button class="borrar" onclick="borrarAhorro(${a.id})">🗑️</button>
            </div>
          </div>
        `).join('');
      }
      actualizarInicio();
    }

    // --- Inversiones ---
    let inversiones = JSON.parse(localStorage.getItem('inversiones') || '[]');

    function guardarInversiones() {
      localStorage.setItem('inversiones', JSON.stringify(inversiones));
    }

    function agregarInversion() {
      const monto = parseFloat(document.getElementById('inv-monto').value);
      if (!monto || monto <= 0) {
        alert('Ingresá un monto válido');
        return;
      }
      const f = leerFecha('inv-fecha');
      const inversion = {
        id: Date.now(),
        monto: monto,
        tipo: document.getElementById('inv-tipo').value,
        ticker: document.getElementById('inv-ticker').value,
        nota: document.getElementById('inv-nota').value,
        fecha: f.fecha,
        fechaISO: f.fechaISO
      };
      inversiones.unshift(inversion);
      guardarInversiones();
      document.getElementById('inv-monto').value = '';
      document.getElementById('inv-ticker').value = '';
      document.getElementById('inv-nota').value = '';
      document.getElementById('inv-fecha').value = hoyISO();
      renderInversiones();
    }

    function borrarInversion(id) {
      inversiones = inversiones.filter(inv => inv.id !== id);
      guardarInversiones();
      renderInversiones();
    }

    function renderInversiones() {
      const lista = document.getElementById('inv-lista');
      const total = inversiones.reduce((s, inv) => s + inv.monto, 0);
      document.getElementById('inv-total').textContent = total.toLocaleString('es-AR');

      if (inversiones.length === 0) {
        lista.innerHTML = '<div class="vacio">No hay inversiones cargadas todavía</div>';
      } else {
        lista.innerHTML = inversiones.map(inv => `
          <div class="gasto">
            <div class="gasto-info">
              <strong>${inv.tipo}${inv.ticker ? ' · ' + inv.ticker : ''}</strong>
              <small>${inv.fecha}${inv.nota ? ' · ' + inv.nota : ''}</small>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="inversion-monto">$${inv.monto.toLocaleString('es-AR')}</span>
              <button class="borrar" onclick="borrarInversion(${inv.id})">🗑️</button>
            </div>
          </div>
        `).join('');
      }
      actualizarInicio();
    }

    // --- Inicio: actualizar todo ---
    function actualizarInicio() {
      renderPatrimonio();
      renderInicio();
    }

    // --- Inicio: tarjeta de patrimonio + gráfico ---
    function renderPatrimonio() {
      const cont = document.getElementById('patrimonio');

      const totalIng = ingresos.reduce((s, x) => s + x.monto, 0);
      const totalGas = gastos.reduce((s, x) => s + x.monto, 0);
      const totalAho = ahorros.reduce((s, x) => s + x.monto, 0);
      const totalInv = inversiones.reduce((s, x) => s + x.monto, 0);
      const disponible = totalIng - totalGas;
      const patrimonio = disponible + totalAho + totalInv;

      const movs = [];
      ingresos.forEach(i => movs.push({ d: fechaDe(i), v: i.monto }));
      gastos.forEach(g => movs.push({ d: fechaDe(g), v: -g.monto }));
      ahorros.forEach(a => movs.push({ d: fechaDe(a), v: a.monto }));
      inversiones.forEach(inv => movs.push({ d: fechaDe(inv), v: inv.monto }));

      if (movs.length === 0) {
        cont.innerHTML = '<div class="card"><div class="vacio">Cargá datos para ver tu patrimonio.</div></div>';
        return;
      }

      const netMes = {};
      movs.forEach(m => {
        const d = m.d;
        const clave = d.getFullYear() + '-' + String(d.getMonth()).padStart(2, '0');
        if (!netMes[clave]) netMes[clave] = { anio: d.getFullYear(), mes: d.getMonth(), net: 0 };
        netMes[clave].net += m.v;
      });

      const claves = Object.keys(netMes).sort();
      let acum = 0;
      const puntos = claves.map(k => {
        acum += netMes[k].net;
        return { mes: netMes[k].mes, anio: netMes[k].anio, valor: acum };
      });

      cont.innerHTML = `
        <div class="card">
          <div class="patri-label">💼 Patrimonio total</div>
          <div class="patri-valor ${patrimonio >= 0 ? 'verde' : 'rojo'}">${fmt(patrimonio)}</div>
          ${construirGrafico(puntos)}
          <div class="desglose">
            <div><small>Disponible</small><span class="${disponible >= 0 ? 'verde' : 'rojo'}">${fmt(disponible)}</span></div>
            <div><small>Ahorros</small><span class="azul">${fmt(totalAho)}</span></div>
            <div><small>Inversiones</small><span class="naranja">${fmt(totalInv)}</span></div>
          </div>
        </div>
      `;
    }

    function construirGrafico(puntos) {
      const W = 320, H = 150, padL = 12, padR = 12, padT = 14, padB = 28;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const n = puntos.length;
      const vals = puntos.map(p => p.valor);
      let min = Math.min(...vals), max = Math.max(...vals);
      if (min === max) { min -= 1; max += 1; }

      const coords = puntos.map((p, i) => {
        const x = padL + (n === 1 ? plotW / 2 : plotW * i / (n - 1));
        const y = padT + plotH * (1 - (p.valor - min) / (max - min));
        return { x: x, y: y, p: p };
      });

      let zeroLine = '';
      if (min < 0 && max > 0) {
        const yz = padT + plotH * (1 - (0 - min) / (max - min));
        zeroLine = `<line x1="${padL}" y1="${yz.toFixed(1)}" x2="${W - padR}" y2="${yz.toFixed(1)}" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>`;
      }

      const linea = coords.length > 1
        ? `<polyline fill="none" stroke="#a78bfa" stroke-width="2" points="${coords.map(c => c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ')}"/>`
        : '';

      const circulos = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="#a78bfa"/>`).join('');

      const etiquetas = coords.map(c => `<text x="${c.x.toFixed(1)}" y="${H - 8}" fill="#94a3b8" font-size="9" text-anchor="middle">${MESES[c.p.mes].slice(0, 3)}</text>`).join('');

      return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:10px;">${zeroLine}${linea}${circulos}${etiquetas}</svg>`;
    }

    // --- Inicio: histórico mensual ---
    function renderInicio() {
      const cont = document.getElementById('resumen-mensual');
      const meses = {};

      function agrupar(items, tipo) {
        items.forEach(item => {
          const d = fechaDe(item);
          const clave = d.getFullYear() + '-' + String(d.getMonth()).padStart(2, '0');
          if (!meses[clave]) {
            meses[clave] = { anio: d.getFullYear(), mes: d.getMonth(), ingresos: 0, gastos: 0 };
          }
          meses[clave][tipo] += item.monto;
        });
      }

      agrupar(ingresos, 'ingresos');
      agrupar(gastos, 'gastos');

      const claves = Object.keys(meses).sort().reverse();

      if (claves.length === 0) {
        cont.innerHTML = '';
        return;
      }

      cont.innerHTML = claves.map(k => {
        const m = meses[k];
        const balance = m.ingresos - m.gastos;
        const claseBal = balance >= 0 ? 'verde' : 'rojo';
        return `
          <div class="card">
            <div class="mes-titulo">${MESES[m.mes]} ${m.anio}</div>
            <div class="fila"><span>Ingresos</span><span class="verde">$${m.ingresos.toLocaleString('es-AR')}</span></div>
            <div class="fila"><span>Gastos</span><span class="rojo">$${m.gastos.toLocaleString('es-AR')}</span></div>
            <div class="fila balance"><span>Balance</span><span class="${claseBal}">${fmt(balance)}</span></div>
          </div>
        `;
      }).join('');
    }

    // Poner la fecha de hoy por defecto en los 4 campos
    ['g-fecha', 'i-fecha', 'a-fecha', 'inv-fecha'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = hoyISO();
    });

    render();
    renderIngresos();
    renderAhorros();
    renderInversiones();
  </script>
</body>
</html>
