<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Test v8</title>
<style>
body{background:#0d1424;color:#e8e8e8;font:14px system-ui;padding:12px}
h1{color:#c9a86a;font-size:16px}
button,input{margin:6px 0;font-size:14px}
#out{white-space:pre;font:11px monospace;background:#111c30;padding:8px;
border-radius:8px;overflow-x:auto;max-height:70vh;overflow-y:auto}
</style>
</head>
<body>
<h1>Inspector items — v8</h1>
<input type="file" id="f" accept="application/pdf"><br>
<button id="copy">Copiar salida</button>
<div id="out">Elegí el PDF de ING…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const out = document.getElementById('out');
function log(t){ out.textContent += t + "\n"; }

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

document.getElementById('f').addEventListener('change', async e => {
  const file = e.target.files[0];
  if(!file) return;
  out.textContent = "";
  try{
    log("VERSION 8");
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    log("Páginas: " + pdf.numPages);
    const page = await pdf.getPage(1);
    log("Rotación página: " + page.rotate);
    const tc = await page.getTextContent();
    log("Items página 1: " + tc.items.length);
    log("--- t0 t1 t2 t3 | x | y | w | texto ---");
    tc.items.forEach(it => {
      if(!it.str || it.str.trim()==="") return;
      const T = it.transform;
      log(T[0].toFixed(1)+" "+T[1].toFixed(1)+" "+T[2].toFixed(1)+" "+T[3].toFixed(1)
        + " | " + T[4].toFixed(1) + " | " + T[5].toFixed(1)
        + " | " + it.width.toFixed(1) + " | " + JSON.stringify(it.str));
    });
  }catch(err){
    log("ERROR: " + err.message);
  }
});

document.getElementById('copy').onclick = ()=>{
  navigator.clipboard.writeText(out.textContent).then(()=>alert("Copiado"));
};
</script>
</body>
</html>
