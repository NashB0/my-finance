<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Test</title>
<style>
body{background:#0d1424;color:#e8e8e8;font:14px system-ui;padding:12px}
h1{color:#c9a86a;font-size:16px}
button,input{margin:6px 0;font-size:14px}
#out{white-space:pre;font:11px monospace;background:#111c30;padding:8px;
border-radius:8px;overflow-x:auto;max-height:70vh;overflow-y:auto}
</style>
</head>
<body>
<h1>Diagnóstico pdf.js — líneas</h1>
<input type="file" id="f" accept="application/pdf"><br>
<label>Página: <input type="number" id="pg" value="1" min="1" style="width:60px"></label>
<button id="copy">Copiar salida</button>
<div id="out">Elegí un PDF…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const out = document.getElementById('out');
function log(t){ out.textContent += t + "\n"; }

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// Agrupa los items de una página en líneas por coordenada Y
function agruparLineas(items, tol){
  tol = tol || 3;
  const limpios = items
    .filter(it => it.str && it.str.trim() !== "")
    .map(it => ({
      texto: it.str,
      x: it.transform[4],
      der: it.transform[4] + it.width,
      y: it.transform[5]
    }));

  const lineas = [];
  limpios.forEach(it => {
    let l = lineas.find(L => Math.abs(L.y - it.y) <= tol);
    if(!l){ l = {y: it.y, items: []}; lineas.push(l); }
    l.items.push(it);
  });

  lineas.sort((a,b) => b.y - a.y);              // de arriba hacia abajo
  lineas.forEach(l => l.items.sort((a,b) => a.x - b.x));  // izq a der
  lineas.forEach(l => l.texto = l.items.map(i => i.texto.trim()).join(" "));
  return lineas;
}

document.getElementById('f').addEventListener('change', async e => {
  const file = e.target.files[0];
  if(!file) return;
  out.textContent = "";
  try{
    log("Archivo: " + file.name);
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    log("Páginas totales: " + pdf.numPages);
    const n = Math.min(parseInt(document.getElementById('pg').value)||1, pdf.numPages);
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const lineas = agruparLineas(tc.items, 3);
    log("Líneas en página " + n + ": " + lineas.length);
    log("--- y | texto ---");
    lineas.forEach(l => log(l.y.toFixed(1) + " | " + l.texto));
  }catch(err){
    log("ERROR: " + err.message);
  }
});

document.getElementById('copy').onclick = ()=>{
  navigator.clipboard.writeText(out.textContent).then(()=>alert("Copiado"));
};
</script>
</body>
</html>
