<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Test</title>
<style>
body{background:#0d1424;color:#e8e8e8;font:14px system-ui;padding:12px}
h1{color:#c9a86a;font-size:16px}
button,input{margin:6px 0;font-size:14px}
#out{white-space:pre;font:11px monospace;background:#111c30;padding:8px;
border-radius:8px;overflow-x:auto;max-height:70vh;overflow-y:auto}
</style>
</head>
<body>
<h1>Parser Mercado Pago</h1>
<input type="file" id="f" accept="application/pdf"><br>
<button id="copy">Copiar salida</button>
<div id="out">Elegí el PDF de Mercado Pago…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const out = document.getElementById('out');
function log(t){ out.textContent += t + "\n"; }

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function agruparLineas(items, tol){
  tol = tol || 3;
  const limpios = items
    .filter(it => it.str && it.str.trim() !== "")
    .map(it => ({texto: it.str, x: it.transform[4], y: it.transform[5]}));
  const lineas = [];
  limpios.forEach(it => {
    let l = lineas.find(L => Math.abs(L.y - it.y) <= tol);
    if(!l){ l = {y: it.y, items: []}; lineas.push(l); }
    l.items.push(it);
  });
  lineas.sort((a,b) => b.y - a.y);
  lineas.forEach(l => {
    l.items.sort((a,b) => a.x - b.x);
    l.texto = l.items.map(i => i.texto.trim()).join(" ").replace(/\s+/g," ").trim();
  });
  return lineas;
}

// "$ -1.479,55" -> -1479.55
function numAR(s){
  return parseFloat(s.replace(/[$\s]/g,"").replace(/\./g,"").replace(",","."));
}

const RE_MP = /^(\d{2}-\d{2}-\d{4})\s+(.*?)\s*(\d{9,})\s+(\$\s*-?[\d.]+,\d{2})\s+(\$\s*-?[\d.]+,\d{2})$/;

function parseMercadoPago(lineasTodas){
  const movs = [];
  const esFragmento = t => t && !RE_MP.test(t) && !/\d{2}-\d{2}-\d{4}/.test(t)
                            && !/\$\s*-?[\d.]+,\d{2}/.test(t) && !/^\d+\/\d+$/.test(t)
                            && !/^(operación|ID de la|Fecha|Descripción|Valor|Saldo)$/i.test(t.trim());
  for(let i=0; i<lineasTodas.length; i++){
    const L = lineasTodas[i];
    const m = L.texto.match(RE_MP);
    if(!m) continue;
    let antes = "", desp = "";
    const A = lineasTodas[i-1], D = lineasTodas[i+1];
    if(A && Math.abs(A.y - L.y) < 12 && esFragmento(A.texto)) antes = A.texto;
    if(D && Math.abs(D.y - L.y) < 12 && esFragmento(D.texto)) desp = D.texto;
    let desc = (antes + " " + m[2].trim() + " " + desp).replace(/\s+/g," ").trim();
    const [d,mo,a] = m[1].split("-");
    movs.push({fecha: a+"-"+mo+"-"+d, monto: numAR(m[4]), moneda: "ARS", descripcion: desc});
  }
  return movs;
}

document.getElementById('f').addEventListener('change', async e => {
  const file = e.target.files[0];
  if(!file) return;
  out.textContent = "";
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let todas = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      todas = todas.concat(agruparLineas(tc.items, 3));
    }
    log("Páginas: " + pdf.numPages + " | Líneas: " + todas.length);
    const movs = parseMercadoPago(todas);
    log("MOVIMIENTOS DETECTADOS: " + movs.length);
    let ing=0, gas=0, si=0, sg=0;
    movs.forEach(m => { if(m.monto>=0){ing++; si+=m.monto;} else {gas++; sg+=m.monto;} });
    log("Ingresos: " + ing + "  suma: " + si.toFixed(2));
    log("Gastos:   " + gas + "  suma: " + sg.toFixed(2));
    log("--- fecha | monto | descripción ---");
    movs.forEach(m => log(m.fecha + " | " + m.monto.toFixed(2) + " | " + m.descripcion));
  }catch(err){
    log("ERROR: " + err.message);
  }
});

document.getElementById('copy').onclick = ()=>{
  navigator.clipboard.writeText(out.textContent).then(()=>alert("Copiado"));
};
</script>
</body>
</html>
